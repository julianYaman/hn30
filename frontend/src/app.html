<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>hn30 — Top 30 Hacker News Stories</title>
		<meta name="description" content="A curated daily edition of the top 30 Hacker News stories." />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Press+Start+2P&display=swap"
			rel="stylesheet"
		/>
		<link rel="canonical" href="https://hn30.yamanlabs.com/" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://hn30.yamanlabs.com/" />
		<meta property="og:title" content="hn30 — Top 30 Hacker News Stories" />
		<meta
			property="og:description"
			content="A curated daily edition of the top 30 Hacker News stories."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />
		<script
			defer
			data-domain="hn30.eu"
			src="https://analytics.yamanlabs.com/js/script.js"
		></script>
		<script>
			(function () {
				const theme = localStorage.getItem('theme');
				if (
					theme === 'dark' ||
					(!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
				)
					document.documentElement.classList.add('dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
